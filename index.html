<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Excel 업무 일정과 개인 일정을 한눈에 관리하는 월간 캘린더" />
    <title>Calendar — 업무 일정 관리</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#" aria-label="Calendar 홈">
          <span class="brand-mark" aria-hidden="true"></span>
          Calendar
        </a>

        <div class="header-actions">
          <button class="button button-secondary" id="manage-imports-button" type="button">
            가져온 일정 관리
          </button>
          <button class="button button-secondary" id="excel-import-button" type="button">
            Excel 일정 가져오기
          </button>
        </div>
      </header>

      <main class="calendar-layout">
        <section class="calendar-section" aria-labelledby="calendar-title">
          <div class="calendar-toolbar">
            <button class="month-button" id="prev-month" type="button" aria-label="이전 달">
              <span aria-hidden="true">‹</span>
            </button>
            <h1 id="calendar-title" aria-live="polite"></h1>
            <button class="month-button" id="next-month" type="button" aria-label="다음 달">
              <span aria-hidden="true">›</span>
            </button>
          </div>

          <div class="weekday-row" aria-hidden="true">
            <span>일</span><span>월</span><span>화</span><span>수</span>
            <span>목</span><span>금</span><span>토</span>
          </div>
          <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="월간 일정표"></div>
        </section>

        <aside class="detail-panel" aria-labelledby="detail-heading">
          <div class="selected-date">
            <p class="selected-weekday" id="selected-weekday"></p>
            <p class="selected-day" id="selected-day"></p>
            <p class="selected-month" id="selected-month"></p>
          </div>

          <div class="schedule-section">
            <div class="section-heading">
              <h2 id="detail-heading">일정</h2>
              <span class="schedule-count" aria-label="등록된 일정 0개">0</span>
            </div>
            <div class="selected-events" id="selected-events"></div>
            <div class="empty-state" id="empty-state">
              <span class="empty-line" aria-hidden="true"></span>
              <p>등록된 일정이 없습니다.</p>
              <small>새 일정을 추가해 하루를 계획해 보세요.</small>
            </div>
            <button class="button button-secondary detail-add-button" type="button" data-add-schedule>
              <span aria-hidden="true">+</span> 일정 추가
            </button>
          </div>
        </aside>
      </main>
    </div>

    <div class="modal-backdrop" id="event-modal" hidden>
      <section class="event-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
          <h2 id="modal-title">일정 추가</h2>
          <button class="modal-close" id="modal-close" type="button" aria-label="닫기">×</button>
        </header>
        <form id="event-form">
          <div class="form-field">
            <label for="event-title">제목 <span aria-hidden="true">*</span></label>
            <input id="event-title" name="title" type="text" maxlength="80" required />
          </div>
          <div class="form-field">
            <label for="event-date">날짜 <span aria-hidden="true">*</span></label>
            <input id="event-date" name="date" type="date" required />
          </div>
          <fieldset class="form-field time-field">
            <legend>시간</legend>
            <div class="time-inputs">
              <input id="event-start-time" name="startTime" type="time" aria-label="시작 시간" />
              <span aria-hidden="true">—</span>
              <input id="event-end-time" name="endTime" type="time" aria-label="종료 시간" />
            </div>
          </fieldset>
          <div class="form-field">
            <label for="event-memo">메모</label>
            <textarea id="event-memo" name="memo" rows="4" maxlength="500"></textarea>
          </div>
          <div class="modal-actions">
            <button class="button delete-button" id="delete-event" type="button" hidden>삭제</button>
            <div class="modal-actions-primary">
              <button class="button button-secondary" id="cancel-modal" type="button">취소</button>
              <button class="button button-primary" type="submit">저장</button>
            </div>
          </div>
        </form>
      </section>
    </div>

    <div class="modal-backdrop" id="excel-modal" hidden>
      <section class="event-modal excel-modal" role="dialog" aria-modal="true" aria-labelledby="excel-modal-title">
        <header class="modal-header">
          <h2 id="excel-modal-title">Excel 일정 가져오기</h2>
          <button class="modal-close" id="excel-modal-close" type="button" aria-label="닫기">×</button>
        </header>

        <div id="excel-upload-view">
          <p class="excel-description">Excel 일정표를 업로드하면<br />일정 데이터를 분석합니다.</p>
          <label class="excel-drop-zone" id="excel-drop-zone" for="excel-file-input">
            <span class="drop-zone-title">Excel 파일을 여기에 놓거나</span>
            <span class="button button-secondary file-select-button">파일 선택</span>
            <span class="file-types">.xlsx · .xls</span>
            <input id="excel-file-input" type="file" accept=".xlsx,.xls" hidden />
          </label>
          <p class="excel-error" id="excel-error" role="alert" hidden></p>
          <div class="modal-actions excel-upload-actions">
            <button class="button button-secondary" id="excel-cancel" type="button">취소</button>
          </div>
        </div>

        <div id="excel-result-view" hidden>
          <p class="excel-success"><span aria-hidden="true">✓</span> 파일을 읽었습니다.</p>
          <p class="excel-file-name" id="excel-file-name"></p>
          <p class="excel-sheet-count" id="excel-sheet-count"></p>
          <ul class="excel-sheet-list" id="excel-sheet-list"></ul>
          <div class="modal-actions">
            <button class="button button-secondary" id="excel-reselect" type="button">다시 선택</button>
            <button class="button button-primary" id="excel-next" type="button">다음</button>
          </div>
        </div>

        <div id="excel-review-view" hidden>
          <p class="excel-review-summary" id="excel-review-summary"></p>
          <p class="duplicate-notice" id="duplicate-notice" hidden></p>
          <div class="month-filters" id="month-filters" aria-label="월 필터"></div>
          <div class="selection-toolbar">
            <span class="selection-summary" id="selection-summary"></span>
            <div class="selection-actions">
              <button class="selection-action" id="select-filtered" type="button">전체 선택</button>
            </div>
          </div>
          <div class="import-candidate-list" id="import-candidate-list"></div>
          <div class="modal-actions excel-review-actions">
            <button class="button button-secondary" id="excel-review-back" type="button">이전</button>
            <button class="button button-primary" id="excel-import-selected" type="button">선택한 일정 가져오기</button>
          </div>
        </div>

        <div id="excel-edit-view" hidden>
          <form id="excel-candidate-form">
            <div class="form-field">
              <label for="candidate-title">제목</label>
              <input id="candidate-title" name="title" type="text" required />
            </div>
            <div class="form-field">
              <label for="candidate-date">날짜</label>
              <input id="candidate-date" name="date" type="date" required />
            </div>
            <fieldset class="form-field">
              <legend>시간</legend>
              <div class="time-inputs">
                <input id="candidate-start-time" name="startTime" type="time" aria-label="시작 시간" />
                <span aria-hidden="true">—</span>
                <input id="candidate-end-time" name="endTime" type="time" aria-label="종료 시간" />
              </div>
            </fieldset>
            <div class="form-field">
              <label for="candidate-venue">장소</label>
              <input id="candidate-venue" name="venue" type="text" />
            </div>
            <div class="form-field">
              <label for="candidate-event-type">일정 유형</label>
              <input id="candidate-event-type" name="eventType" type="text" />
            </div>
            <div class="form-field">
              <label for="candidate-memo">메모</label>
              <textarea id="candidate-memo" name="memo" rows="3"></textarea>
            </div>
            <div class="modal-actions">
              <button class="button button-secondary" id="candidate-edit-cancel" type="button">취소</button>
              <button class="button button-primary" type="submit">수정 내용 적용</button>
            </div>
          </form>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="imports-modal" hidden>
      <section class="event-modal imports-modal" role="dialog" aria-modal="true" aria-labelledby="imports-modal-title">
        <header class="modal-header">
          <h2 id="imports-modal-title">가져온 일정 관리</h2>
          <button class="modal-close" id="imports-modal-close" type="button" aria-label="닫기">×</button>
        </header>
        <div class="imports-list" id="imports-list"></div>
        <p class="imports-empty" id="imports-empty" hidden>가져온 Excel 일정이 없습니다.</p>
      </section>
    </div>

    <input id="comparison-file-input" type="file" accept=".xlsx,.xls" hidden />
    <div class="modal-backdrop" id="comparison-modal" hidden>
      <section class="event-modal comparison-modal" role="dialog" aria-modal="true" aria-labelledby="comparison-modal-title">
        <header class="modal-header">
          <h2 id="comparison-modal-title">Excel 일정 변경사항 검토</h2>
          <button class="modal-close" id="comparison-modal-close" type="button" aria-label="닫기">×</button>
        </header>
        <p class="comparison-range" id="comparison-range"></p>
        <div class="comparison-summary" id="comparison-summary"></div>
        <div class="comparison-filters" id="comparison-filters" aria-label="변경 상태 필터"></div>
        <div class="comparison-selection-toolbar">
          <span class="comparison-selection-summary" id="comparison-selection-summary"></span>
          <div class="selection-actions">
            <button class="selection-action" id="select-comparison-filtered" type="button">전체 선택</button>
          </div>
        </div>
        <div class="comparison-list" id="comparison-list"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="excel-parser.js"></script>
    <script src="excel-compare.js"></script>
    <script src="script.js"></script>
  </body>
</html>
